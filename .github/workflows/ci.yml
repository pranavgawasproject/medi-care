name: CI Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  app:
    name: Next.js lint, test, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend-next/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Run Lint
        run: npm run lint

      - name: Build Application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Build must succeed without secrets. Public pages prerender;
          # authenticated routes are force-dynamic.
